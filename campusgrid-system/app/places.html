<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusGrid — Campus places</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="places">
<div class="device">
  <div class="statusbar">
    <span>9:41</span>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
  <div class="screen">
    <div class="screen-bg"></div>
    <div class="app-header">
      <a href="more.html" class="back">‹</a>
      <div style="text-align:right;">
        <span class="eyebrow">Live</span>
        <h1>Campus places</h1>
      </div>
    </div>
    <p class="section-label">Livecount from RFID taps + headcount (not facial)</p>
    <div id="list"></div>
    <p class="muted" id="hint" style="padding:12px 16px;font-size:13px;opacity:.75">Loading…</p>
  </div>
  <nav class="tabbar">
    <a href="index.html">Home</a>
    <a href="directory.html">Find</a>
    <a href="navigation.html">Go</a>
    <a href="assistant.html">AI</a>
    <a href="more.html" class="active">More</a>
  </nav>
</div>
<script src="assets/api.js"></script>
<script src="assets/app.js"></script>
<script>
  (async () => {
    try {
      const rows = await CampusAPI.request('/places/live');
      const list = document.getElementById('list');
      if (!rows.length) {
        document.getElementById('hint').textContent = 'No livecount places yet.';
        return;
      }
      document.getElementById('hint').textContent = 'Cafeteria, library, counselling and admin-added common spaces.';
      list.innerHTML = rows.map(p => {
        const pct = p.capacity ? Math.min(100, Math.round((p.live_count / p.capacity) * 100)) : 0;
        const name = String(p.name).replace(/</g,'&lt;');
        const kind = String(p.kind).replace(/</g,'&lt;');
        return `<div class="card" style="margin:10px 14px;padding:12px;border-radius:14px;background:rgba(255,255,255,.04)">
          <div style="display:flex;justify-content:space-between;gap:8px">
            <div>
              <div style="font-weight:700">${name}</div>
              <div class="muted" style="font-size:12px;text-transform:capitalize">${kind}</div>
            </div>
            <div style="text-align:right">
              <div style="font-size:22px;font-weight:800">${p.live_count}</div>
              <div class="muted" style="font-size:11px">of ${p.capacity || '—'}</div>
            </div>
          </div>
          <div style="height:6px;border-radius:99px;background:rgba(255,255,255,.08);margin-top:10px;overflow:hidden">
            <div style="height:100%;width:${pct}%;background:#3d9b7a"></div>
          </div>
          <div class="muted" style="font-size:11px;margin-top:6px">taps ${p.current_taps} · heads ${p.current_headcount}</div>
        </div>`;
      }).join('');
    } catch (e) {
      document.getElementById('hint').textContent = e.message || 'Could not load places';
    }
  })();
</script>
</body>
</html>
